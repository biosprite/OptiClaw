name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build Store MSIX upload package
        shell: pwsh
        run: .\scripts\build.ps1 -Tag "${{ github.ref_name }}"
      - name: Verify Store artifact
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath .\artifacts -Filter *.msixupload -File)
          if ($artifacts.Count -ne 1) {
            throw "Expected one Store upload package, found $($artifacts.Count)."
          }

          $packages = dotnet list .\src\OptiClaw\OptiClaw.csproj package --include-transitive
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the resolved package graph."
          }
          if ($packages -match 'Microsoft\.WindowsAppSDK\.(AI|ML)') {
            throw "The release package graph unexpectedly includes Windows App SDK AI/ML components."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OptiClaw-${{ github.ref_name }}-store-package
          path: artifacts/*.msixupload
          if-no-files-found: error
